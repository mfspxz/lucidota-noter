[package]
name = "noter-sync"
version = "0.1.0"
edition = "2024"
description = "NOTER device sync protocol: signed envelopes, version vectors, deterministic LWW merge, conflict copies."

[dependencies]
noter-crypto = { path = "../noter-crypto" }
noter-store = { path = "../noter-store" }
noter-model = { path = "../noter-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
