[package]
name = "noter-airgap"
version = "0.1.0"
edition = "2024"
description = "NOTER airgap transfer: sealed bundles split into QR-sized frames; file or QR shuttle."

[dependencies]
noter-crypto = { path = "../noter-crypto" }
noter-store = { path = "../noter-store" }
noter-sync = { path = "../noter-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
blake3 = "1"
thiserror = "1"
qrcode = "0.14"
