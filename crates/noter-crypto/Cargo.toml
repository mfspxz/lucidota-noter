[package]
name = "noter-crypto"
version = "0.1.0"
edition = "2024"
description = "NOTER E2EE crypto core: audited primitives only (XChaCha20-Poly1305, X25519, Ed25519, Argon2id, BLAKE3). No custom crypto."

[dependencies]
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
argon2 = "0.5"
blake3 = "1"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
thiserror = "1"

[dev-dependencies]
