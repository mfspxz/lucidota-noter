[package]
name = "noter-share"
version = "0.1.0"
edition = "2024"
description = "NOTER E2EE sharing: share notes with another user without trusting any server."

[dependencies]
noter-crypto = { path = "../noter-crypto" }
noter-model = { path = "../noter-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
