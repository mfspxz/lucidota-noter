[package]
name = "noter-desktop"
version = "0.1.0"
edition = "2021"

# NOTE: this crate is intentionally NOT a member of the noter workspace.
# It needs a desktop with webkit2gtk to link (see README.md).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noter-ui = { path = "../crates/noter-ui" }
noter-crypto = { path = "../crates/noter-crypto" }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
