[package]
name = "noter-mesh"
version = "0.1.0"
edition = "2024"
description = "NOTER local mesh transport: encrypted TCP peer sessions + LAN discovery, no central server."

[dependencies]
noter-crypto = { path = "../noter-crypto" }
blake3 = "1"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
