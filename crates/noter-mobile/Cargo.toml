[package]
name = "noter-mobile"
version = "0.1.0"
edition = "2024"
description = "NOTER mobile field layer: offline-first op queue, quick capture, on-demand sync."

[dependencies]
noter-crypto = { path = "../noter-crypto" }
noter-store = { path = "../noter-store" }
noter-model = { path = "../noter-model" }
noter-sync = { path = "../noter-sync" }
noter-ui = { path = "../noter-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
