[package]
name = "noter-legal-authority"
version = "0.1.0"
edition = "2024"
description = "legallibrary as a NOTER plugin: legal authority behind the organelle host contract (codon ls)."

[dependencies]
legal-authority-engine = { path = "../../../legallibrary-organelle/engine" }
organelle-host = { path = "../../../organelles/crates/organelle-host" }
organelle-manifest = { path = "../../../organelles/crates/organelle-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
noter-organelle = { path = "../noter-organelle" }
noter-crypto = { path = "../noter-crypto" }
